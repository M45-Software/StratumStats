name: Deploy pool registry

on:
  push:
    branches: [main]
    paths:
      - config/pools.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stratumstats-production-pools
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go run . validate-config -config config/pools.json
      - run: go test ./...
      - run: go vet ./...

  deploy:
    needs: validate
    environment: production
    runs-on: [self-hosted, stratumstats-production]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/update-pools-production.sh
